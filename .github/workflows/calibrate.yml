# Live qualification of one provider/model route against the graded self-tests
# (ACA-0012). Self-tests bypass the verdict cache and spend real judge calls,
# so this workflow is dispatch-only and never scheduled: a route is measured
# when someone asks for it, not on a timer.
name: calibrate
run-name: calibrate ${{ inputs.provider }}/${{ inputs.model }} (${{ inputs.checks }})
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Judge provider to qualify
        required: true
        type: choice
        # No `local`: this lane runs on a hosted runner, and the local adapter
        # dials localhost. Dispatching it would measure connection failures as
        # fixture misses and report a route as unqualified that was never
        # reached. Qualify a local server from the machine that hosts it.
        options:
          - anthropic
          - openai
          - qwen
      model:
        description: Exact model id, as the provider names it
        required: true
        type: string
      checks:
        description: Comma-separated check names, or "all"
        required: true
        default: all
        type: string
      openai_base_url:
        description: OpenAI-compatible endpoint (e.g. an inference router); blank uses OpenAI itself
        required: false
        type: string
      qwen_base_url:
        description: Qwen endpoint; required when provider is qwen
        required: false
        type: string

permissions:
  contents: read

# One qualification run per route at a time: concurrent runs of the same
# tuple would bill twice for one answer.
concurrency:
  group: calibrate-${{ inputs.provider }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  policy:
    name: Action Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: qwts/playbook-engineering/.github/actions/ci-policy@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          authorization-only: 'true'

  select:
    name: Select checks
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked selection dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install locked selection dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'
      - id: list
        env:
          REQUESTED: ${{ inputs.checks }}
        run: |
          set -euo pipefail
          checks=$(node scripts/list-checks.ts "$REQUESTED")
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "Qualifying: $checks"

  qualify:
    name: ${{ matrix.check }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.select.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked qualification dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install locked qualification dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'
      # An unqualified check is a measurement, not a workflow failure: the run
      # must reach the summary so every row is visible together.
      - name: Self-test
        continue-on-error: true
        env:
          ACA_PROVIDER: ${{ inputs.provider }}
          ACA_MODEL: ${{ inputs.model }}
          OPENAI_BASE_URL: ${{ inputs.openai_base_url }}
          QWEN_BASE_URL: ${{ inputs.qwen_base_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # Dispatch inputs and matrix values reach the shell as environment
          # values, never as template text spliced into the script.
          CHECK: ${{ matrix.check }}
        run: |
          mkdir -p results
          node src/cli.ts "$CHECK" --self-test --json | tee "results/$CHECK.json"
      # Uploads even when setup failed, so a dead runner shows up as an empty
      # result rather than vanishing from a table that would then read as a
      # clean sweep. The report job also renders a row for any check with no
      # artifact at all.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: qualification-${{ matrix.check }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Qualification summary
    needs: [policy, select, qualify]
    if: always() && needs.policy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: results
          pattern: qualification-*
          merge-multiple: false
      - name: Render the table
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          SELECTED: ${{ needs.select.outputs.checks }}
        run: |
          {
            echo "## Route qualification"
            echo ""
            echo "Route: \`$PROVIDER/$MODEL\`"
            echo ""
            node scripts/qualification-summary.ts results "$SELECTED"
          } >> "$GITHUB_STEP_SUMMARY"
